# Déploiement gratuit sur Render (Blueprint) : voir docs/deploiement-render.md
#
# - solidhive-api   : l'API NestJS + Chromium, construite depuis server/Dockerfile
# - solidhive-redis : sessions et cache (Render Key Value, réseau privé)
# - solidhive       : le client Vue en site statique ; /api, /files et /uploads
#                     sont réécrits vers l'API pour rester sur la même origine
#                     (cookies de session en first-party).
#
# La base PostgreSQL et le stockage des fichiers sont chez Neon : renseigner
# DATABASE_URL et les variables AWS_* à la création.

services:
  - name: solidhive-api
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # URL Neon, avec ?sslmode=require
      - key: DB_SSL
        value: 'true'
      - key: REDIS_URL
        fromService:
          name: solidhive-redis
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: FRONTEND_URL
        value: https://solidhive.theotimepagies.com
      # Démo : Stripe en clés de test sans comptes Connect réels ; les paiements passent
      # par Checkout test (carte 4242…) et les virements vers les associations sont simulés.
      - key: USE_STRIPE_MOCK
        value: 'true'
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Spécifique à Render : ses instances gratuites bloquent les ports SMTP sortants.
      # Le transport HTTP de common/utils/email/brevo-api.transport.ts prend le relais.
      - key: EMAIL_TRANSPORT
        value: brevo-api
      - key: BREVO_API_KEY
        sync: false # clé API v3 de Brevo (xkeysib-…), pas la clé SMTP
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: SolidHive
      - key: EMAIL_SUPPORT
        sync: false
      # Fichiers (images, PDF) sur Neon Object Storage, compatible S3
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: STORAGE_BUCKET
        value: solidhive

  - name: solidhive-redis
    type: keyvalue
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # accessible uniquement depuis le réseau privé Render

  - name: solidhive
    type: web
    runtime: static # servi par le CDN Render, pas de région à choisir
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    domains:
      - solidhive.theotimepagies.com
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://solidhive-api.onrender.com/*
      - type: rewrite
        source: /files/*
        destination: https://solidhive-api.onrender.com/files/*
      - type: rewrite
        source: /uploads/*
        destination: https://solidhive-api.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
